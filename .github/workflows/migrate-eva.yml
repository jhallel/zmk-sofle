name: Migrate EVA display theme

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/migrate-eva.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zmk-sofle
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout known-good EVA display source
        uses: actions/checkout@v4
        with:
          repository: jhallel/zmk-config
          ref: eva-niceview-animation
          path: source-zmk-config
          persist-credentials: false

      - name: Port custom nice!view shield
        shell: bash
        run: |
          set -euo pipefail
          rm -rf boards/shields/nice_view_custom
          mkdir -p boards/shields
          cp -a source-zmk-config/boards/shields/nice_view_custom boards/shields/

          # zmk-config set 19.58s in sofle.conf. Keep that timing local to
          # the shield here so the settings-reset build never sees an unknown symbol.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('boards/shields/nice_view_custom/Kconfig.defconfig')
          text = p.read_text()
          text = text.replace('default 22000', 'default 19580', 1)
          p.write_text(text)
          PY

          cat > build.yaml <<'YAML'
          ---
          include:
            - board: eyelash_sofle_right
              shield: nice_view_custom
            - board: eyelash_sofle_left
              shield: nice_view_custom
              snippet: studio-rpc-usb-uart
              cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
              artifact-name: eyelash_sofle_studio_left
            - board: eyelash_sofle_left
              shield: settings_reset
          YAML

          cat > config/west.yml <<'YAML'
          manifest:
            remotes:
              - name: zmkfirmware
                url-base: https://github.com/zmkfirmware
            projects:
              - name: eyelash_sofle
                url: https://github.com/a741725193/zmk-sofle
                revision: main
              - name: zmk
                remote: zmkfirmware
                revision: main
                import: app/west.yml
            self:
              path: boards
          YAML

          rm -rf source-zmk-config

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to migrate"
            exit 0
          fi
          git commit -m "Port Evangelion nice!view theme to zmk-sofle"
          git push origin HEAD:main
